services:
  mysql:
    image: mysql:8.0
    container_name: settleup-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: settleup
    ports:
      - "3306:3306"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - settleup-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: settleup-redis
    ports:
      - "6379:6379"
    # TODO: appendonly:让 Redis 里的库存在重启后不丢。这本身就是个可靠性话题——
    # 库存扣在 Redis、状态落在 MySQL,两个存储的持久化保证不一样。
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - settleup-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  settleup-mysql-data:
  settleup-redis-data:
